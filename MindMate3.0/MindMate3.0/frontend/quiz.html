<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Skill Quiz - BridgeUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container py-5">
    <button class="btn btn-link mb-3" onclick="go('index.html')">&larr; Back</button>
    <div class="card p-4">
      <h4>Quick Skill Quiz</h4>
      <p>10 short MCQs + 2 coding confidence questions — demo version.</p>

      <form id="skillForm">
        <div id="questionsContainer"></div>
        <div class="mt-3">
          <button class="btn btn-primary" type="button" onclick="submitQuiz()">Submit & Get Level</button>
        </div>
      </form>

      <div id="quizResult" class="mt-4"></div>
    </div>
  </div>

  <script src="skill.js"></script>
  <script>
    createQuizUI();
  </script>
</body>
</html>
