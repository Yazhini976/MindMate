<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Find Mentors - BridgeUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container py-4">
    <button class="btn btn-link mb-3" onclick="go('dashboard.html')">&larr; Back</button>
    <div class="row">
      <div class="col-md-4">
        <div class="card p-3 mb-3">
          <h6>Filter</h6>
          <label>Domain</label>
          <select id="filterDomain" class="form-select mb-2">
            <option value="">All</option>
            <option>Web</option><option>DSA</option><option>AI/ML</option><option>Embedded/IoT</option>
          </select>
          <label>Tier</label>
          <select id="filterTier" class="form-select mb-2"><option value="">All</option><option>Tier 1</option><option>Tier 2</option><option>Tier 3</option></select>
          <button class="btn btn-primary w-100" onclick="renderMentors()">Apply</button>
        </div>
      </div>
      <div class="col-md-8">
        <div id="mentorsContainer" class="row g-3"></div>
      </div>
    </div>
  </div>

  <script src="scripts.js"></script>
  <script> renderMentors(); </script>
</body>
</html>
