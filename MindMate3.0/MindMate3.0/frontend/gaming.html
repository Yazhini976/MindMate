<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Gaming Connect - BridgeUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container py-4">
    <button class="btn btn-link mb-3" onclick="go('dashboard.html')">&larr; Back</button>
    <div class="card p-3">
      <h5>Event Room Code</h5>
      <div class="d-flex gap-2 mb-3">
        <input id="roomCode" class="form-control" placeholder="Enter event code">
        <button class="btn btn-primary" onclick="joinRoom()">Join</button>
      </div>
      <p>Or click to quick-match with similar interests</p>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-primary" onclick="quickMatch()">Quick Match</button>
        <button class="btn btn-outline-secondary" onclick="go('hackmatch.html')">Find Team</button>
      </div>
      <div id="gameMatchResult" class="mt-3"></div>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
