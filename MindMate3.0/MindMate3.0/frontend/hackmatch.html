<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Team Finder - BridgeUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container py-4">
    <button class="btn btn-link mb-3" onclick="go('dashboard.html')">&larr; Back</button>

    <div class="card p-3 mb-4">
      <h5>Create / Search Team</h5>
      <div class="row g-2">
        <div class="col-md-4"><input id="tmDomain" class="form-control" placeholder="Domain (e.g., Web)"></div>
        <div class="col-md-4"><input id="tmRole" class="form-control" placeholder="Role needed (UI/Backend/DS)"></div>
        <div class="col-md-4"><button class="btn btn-primary w-100" onclick="postTeam()">Post Request</button></div>
      </div>
    </div>

    <div id="teamPosts" class="row g-3"></div>
  </div>

  <script src="scripts.js"></script>
  <script> loadTeamPosts(); </script>
</body>
</html>
