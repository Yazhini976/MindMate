<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Mentor Chat</title>

  <!-- Bootstrap CSS CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Socket.IO Client -->
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="mentor.css" />
</head>
<body class="light-theme d-flex justify-content-center align-items-center vh-100">

  <div class="chat-card card shadow-lg d-flex flex-column" id="chatCard" style="max-width: 500px; width: 90%; height: 85vh;">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <span id="mentorAvatar" class="mentor-avatar">🤖</span>
        <div>
          <h5 class="mb-0 fw-semibold" id="mentorName">AI Mentor</h5>
          <small class="text-muted" id="mentorSpecialty">Choose your mentor</small>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button id="mentorSelectBtn" class="btn btn-sm btn-outline-primary" aria-label="Select mentor">👥</button>
        <button id="themeToggle" class="btn btn-sm btn-outline-secondary" aria-label="Toggle light/dark theme">🌙</button>
      </div>
    </div>

    <!-- Mentor Selection Modal -->
    <div class="modal fade" id="mentorModal" tabindex="-1" aria-labelledby="mentorModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="mentorModalLabel">Choose Your Mentor</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row" id="mentorGrid">
              <!-- Mentors will be loaded here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="chatWindow" class="card-body overflow-auto d-flex flex-column gap-3" style="flex-grow:1;">
      <!-- Messages appear here -->
    </div>

    <form id="chatForm" class="card-footer d-flex gap-2" autocomplete="off" aria-label="Chat input form">
      <input
        id="chatInput"
        type="text"
        class="form-control"
        placeholder="Type your message..."
        aria-required="true"
        maxlength="500"
        required
      />
      <button type="submit" class="btn btn-primary" aria-label="Send message">➤</button>
    </form>
  </div>

  <!-- Bootstrap Bundle with Popper (for any bootstrap JS) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="mentor.js"></script>
</body>
</html>
